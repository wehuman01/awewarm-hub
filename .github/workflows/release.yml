name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          import re, sys
          from pathlib import Path
          tag = "${{ github.ref_name }}"
          text = Path("src/awewarm_hub/__init__.py").read_text()
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', text, re.MULTILINE)
          if not match:
              sys.exit("__version__ not found in src/awewarm_hub/__init__.py")
          version = match.group(1)
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match package version {version}")
        shell: python
      - name: Install (engine from its release tag while PyPI lags a lockstep release)
        shell: bash
        run: |
          pip install -e . || {
            minor=$(python -c "import re; print(re.search(r'awewarm>=([0-9]+\.[0-9]+)', open('pyproject.toml').read()).group(1))")
            echo "awewarm $minor.* not on PyPI yet; installing engine v$minor.0 from its release tag"
            pip install "git+https://github.com/wehuman01/awewarm@v$minor.0"
            pip install -e .
          }
      - run: python -m unittest discover -s tests
      - name: Extract release notes from CHANGELOG
        run: |
          python - <<'EOF'
          import sys
          from pathlib import Path
          tag = "${{ github.ref_name }}"
          text = Path("docs/CHANGELOG.md").read_text()
          marker = f"## {tag.lstrip('v')}"
          start = text.find(marker)
          if start == -1:
              start = text.find(f"## {tag}")
          if start == -1:
              sys.exit(f"no CHANGELOG section for {tag}")
          end = text.find("\n## ", start + 1)
          notes = text[start:end].split("\n", 1)[1].strip() if end != -1 else text[start:].split("\n", 1)[1].strip()
          Path("release-notes.md").write_text(notes + "\n")
          EOF
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
      - name: Build and publish to PyPI
        run: |
          pip install build twine
          python -m build
          twine upload dist/* -u __token__ -p ${{ secrets.PYPI_API_TOKEN }}
