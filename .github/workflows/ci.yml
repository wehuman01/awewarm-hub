name: CI

on:
  push:
    branches: [main]
    paths: [src/**, tests/**, pyproject.toml]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (engine from its release tag while PyPI lags a lockstep release)
        shell: bash
        run: |
          pip install -e . || {
            minor=$(python -c "import re; print(re.search(r'awewarm>=([0-9]+\.[0-9]+)', open('pyproject.toml').read()).group(1))")
            echo "awewarm $minor.* not on PyPI yet; installing engine v$minor.0 from its release tag"
            pip install "git+https://github.com/wehuman01/awewarm@v$minor.0"
            pip install -e .
          }
      - run: python -m unittest discover -s tests -v

  package:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
