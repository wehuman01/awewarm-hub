[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awewarm-hub"
dynamic = ["version"]
description = "Multi-tenant hub server for awewarm: one box, many invited users."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["awewarm>=0.5.5,<0.6", "click>=8.1"]
authors = [
  { name = "Peng" }
]
license = "MPL-2.0"
keywords = ["ai", "agent", "scheduler", "keep-alive", "hub"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities"
]

[project.urls]
Homepage = "https://github.com/wehuman01/awewarm-hub"
Repository = "https://github.com/wehuman01/awewarm-hub"
Changelog = "https://github.com/wehuman01/awewarm-hub/blob/main/docs/CHANGELOG.md"
Engine = "https://github.com/wehuman01/awewarm"

[project.scripts]
awewarm-hub = "awewarm_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "awewarm_hub.__version__"}
